<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Highway – 3D Tech Demo</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#03050a;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#fff}
  #game{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none}
  .box{position:absolute;background:rgba(5,9,17,.72);border:1px solid rgba(126,162,220,.55);backdrop-filter:blur(5px);padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
  #score{left:18px;top:18px}
  #speed{right:18px;top:18px;text-align:right}
  #near{left:18px;top:92px}
  #help{left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;color:#b9c8e6;white-space:nowrap}
  .big{font-size:30px;font-weight:900;letter-spacing:1px}
  .label{font-size:11px;color:#8ea4c9;letter-spacing:1px}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.52);z-index:3}
  #overlay .panel{width:min(430px,88vw);padding:22px;background:#0b1220;border:1px solid #566b93;box-shadow:0 30px 80px rgba(0,0,0,.55)}
  #overlay h1{margin:0 0 8px;font-size:26px}
  #overlay p{color:#a9b7cf;line-height:1.45}
  button{pointer-events:auto;appearance:none;border:1px solid #59dfff;background:#10293a;color:#eafcff;padding:12px 18px;font:bold 15px ui-monospace,monospace;cursor:pointer}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  #touch .zone{position:absolute;bottom:0;width:50%;height:36%;pointer-events:auto}
  #touch .left{left:0}.right{right:0}
  #touch .hint{position:absolute;bottom:28px;font-size:34px;opacity:.28}
  #touch .left .hint{left:40px}.right .hint{right:40px}
  #cameraBtn{position:fixed;right:18px;bottom:18px;z-index:4;border-radius:14px;padding:10px 12px;min-width:112px;background:rgba(11,24,39,.82);backdrop-filter:blur(5px)}
  #cameraBtn span{display:block;font-size:10px;opacity:.7;margin-top:2px}

  /* ---- garage UI ---- */
  #garageUI{position:fixed;inset:0;z-index:5;display:none;pointer-events:none}
  #garageTop{position:absolute;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  #garageTop .box{pointer-events:none}
  #garageTitle{
    position:absolute;left:26px;top:96px;
    text-shadow:0 0 18px rgba(89,223,255,.16), 3px 3px 0 rgba(0,0,0,.55)
  }
  #garageTitle .main{font-size:34px;font-weight:900;letter-spacing:1px}
  #garageTitle .sub{font-size:12px;color:#9db3d7;letter-spacing:2px;margin-top:5px}
  #garageMenu{position:absolute;left:24px;bottom:24px;display:flex;gap:12px;pointer-events:auto;z-index:2}
  #garageMenu button{box-shadow:0 8px 24px rgba(0,0,0,.28)}
  #garagePanel{
    position:absolute;right:18px;top:74px;bottom:26px;width:min(272px,25vw);
    background:rgba(9,14,25,.94);border:1px solid rgba(126,162,220,.45);
    box-shadow:0 24px 54px rgba(0,0,0,.42);backdrop-filter:blur(7px);
    overflow:hidden;display:block;opacity:0;pointer-events:none;
    transform:translateX(calc(100% + 24px));transition:transform .24s ease, opacity .18s ease
  }
  #garagePanel.open{opacity:1;pointer-events:auto;transform:translateX(0)}
  #garagePanelHead{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border-bottom:1px solid rgba(126,162,220,.25)
  }
  #garagePanelBody{padding:10px;display:flex;flex-direction:column;gap:9px;overflow:auto;height:calc(100% - 54px)}
  .garageCard{background:rgba(12,18,31,.92);border:1px solid rgba(126,162,220,.22);padding:12px}
  .garageCard .ttl{font-size:12px;color:#8ea4c9;letter-spacing:1px;margin-bottom:8px}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .swatch{
    width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);
    cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.24)
  }
  .swatch.active{outline:2px solid #59dfff;outline-offset:2px}
  .swatchWrap{display:flex;flex-direction:column;align-items:center;gap:4px}
  .swatchPrice{font-size:10px;color:#ffd772}
  .buyBtn{
    border:1px solid rgba(89,223,255,.72);background:#122c3e;color:#effbff;
    padding:8px 11px;font:bold 12px ui-monospace,monospace;cursor:pointer
  }
  .buyBtn.alt{border-color:rgba(255,255,255,.2);background:#182131}
  .garageRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .garageStat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .garageStat:last-child{border-bottom:0}
  #garageHint{
    position:absolute;left:50%;bottom:74px;transform:translateX(-50%);
    background:rgba(8,12,22,.72);border:1px solid rgba(126,162,220,.35);
    color:#b4c4e1;padding:8px 12px;font-size:12px;pointer-events:none
  }
  #overlay .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  #overlay .actions button.secondary{border-color:#6c7f9f;background:#182131}
  #garageTop .box{width:180px;min-width:0}
  #garageTop .big{font-size:22px;line-height:1.05}
  #garageTop .label{font-size:10px}

  #hoodScreen{
    position:fixed;
    left:50%;
    bottom:-2px;
    transform:translateX(-50%);
    width:min(92vw,1080px);
    height:24vh;
    min-height:150px;
    max-height:270px;
    z-index:3;
    pointer-events:none;
    display:none;
    filter:drop-shadow(0 -10px 24px rgba(0,0,0,.35));
  }
  #hoodScreen .hood{
    position:absolute;inset:0;
    clip-path:polygon(3% 100%,10% 43%,24% 15%,39% 4%,61% 4%,76% 15%,90% 43%,97% 100%);
    background:
      linear-gradient(90deg,rgba(255,255,255,.10),transparent 17%,transparent 83%,rgba(255,255,255,.08)),
      linear-gradient(180deg,#444b56 0%,#303640 42%,#20252d 100%);
    border-top:2px solid rgba(220,230,244,.28);
  }
  #hoodScreen .creaseL,#hoodScreen .creaseR{
    position:absolute;
    top:20%;
    width:2px;
    height:66%;
    background:linear-gradient(180deg,rgba(210,222,238,.45),rgba(210,222,238,0));
    transform-origin:top center;
  }
  #hoodScreen .creaseL{left:39%;transform:rotate(8deg)}
  #hoodScreen .creaseR{right:39%;transform:rotate(-8deg)}
  @media (max-width:900px),(pointer:coarse){
    #touch{display:block} #help{display:none}
    #cameraBtn{right:34px;bottom:224px;min-width:86px;padding:9px 10px}
    #garageTop{left:10px;right:10px;top:10px}
    #garageTitle{left:14px;top:76px}
    #garageTitle .main{font-size:26px}
    #garagePanel{left:auto;right:8px;top:74px;bottom:12px;width:min(264px,74vw);max-height:none}
    #garageMenu{left:12px;bottom:14px;gap:8px}
    #garageMenu button{padding:10px 12px;font-size:13px}
    #garageHint{display:none}
  }
</style>



<style>
#garageUI,#cameraBtn,#hoodScreen{display:none!important}
#help{background:rgba(8,16,28,.86);border:1px solid rgba(117,231,255,.3);color:#b9c8e6;box-shadow:4px 4px 0 rgba(0,0,0,.25)}
.box{background:rgba(9,18,32,.9);border:1px solid rgba(117,231,255,.42);border-top:3px solid #63d4ec;box-shadow:4px 4px 0 rgba(0,0,0,.3)}
#overlay .panel{background:#0d1729;border:1px solid #4c6588;border-top:4px solid #f26aaa;box-shadow:8px 8px 0 rgba(2,4,10,.65)}

<body>
<div id="game"></div>

<div id="garageUI">
  <div id="garageTop">
    <div class="box"><div class="label">CREDITS</div><div class="big" id="creditsVal">0 CR</div></div>
    <div class="box" style="text-align:right"><div class="label">BEST RUN</div><div class="big" id="bestRunVal">0.0 km</div></div>
  </div>
  <div id="garageTitle">
    <div class="main">NEON HIGHWAY</div>
    <div class="sub">TOKYO NIGHT // GARAGE A V0.32P</div>
  </div>
  <div id="garageMenu">
    <button id="playBtn">PLAY</button>
    <button id="tuneBtn">TUNE</button>
    <button id="statsBtn">STATS</button>
  </div>
  <div id="garagePanel">
    <div id="garagePanelHead">
      <strong id="garagePanelTitle">TUNE</strong>
      <button id="closeGaragePanel" class="secondary">BACK</button>
    </div>
    <div id="garagePanelBody"></div>
  </div>
  <div id="garageHint">AUTO MIT MAUS/FINGER DREHEN // TUNE-MENÜ RECHTS</div>
</div>


<div id="hud">
  <div id="score" class="box"><div class="label">SCORE</div><div class="big" id="scoreVal">0</div></div>
  <div id="near" class="box"><div class="label">NEAR MISS</div><div class="big" id="nearVal">x1</div><div class="label" id="boostVal">BOOST 0%</div></div>
  <div id="speed" class="box"><div class="label">SPEED</div><div class="big"><span id="speedVal">125</span> <span style="font-size:14px">km/h</span></div><div class="label" id="distVal">0.0 km</div></div>
  <div id="help" class="box">← → / A D LENKEN &nbsp; • &nbsp; ↑ / W GAS-BOOST &nbsp; • &nbsp; HOOD CAM</div>
</div>

<div id="touch">
  <div class="zone left" id="touchLeft"><div class="hint">◀</div></div>
  <div class="zone right" id="touchRight"><div class="hint">▶</div></div><div id="gasBtn" style="position:absolute;right:24px;bottom:118px;width:92px;height:92px;border-radius:50%;border:2px solid rgba(89,223,255,.7);background:rgba(16,41,58,.7);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;pointer-events:auto;box-shadow:0 0 24px rgba(89,223,255,.2)">GAS</div>
</div>

<div id="hoodScreen"><div class="hood"></div><div class="creaseL"></div><div class="creaseR"></div></div>
<button id="cameraBtn" type="button">CAMERA<span>CHASE</span></button>

<div id="overlay" style="display:none">
  <div class="panel">
    <h1 id="overlayTitle">CRASH</h1>
    <p id="overlayText">Run beendet.</p>
    <div class="actions">
      <button id="startBtn">RETRY</button>
      <button id="overlayGarageBtn" class="secondary">GARAGE</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const holder = document.getElementById('game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1230);
scene.fog = new THREE.FogExp2(0x0c1430, 0.0068);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 900);
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.28;
holder.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0x91aaf0,0x24203a,3.35);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0xd7e7ff,2.65);
moon.position.set(-8,14,8);
scene.add(moon);

const world = new THREE.Group();
scene.add(world);

// ---------- save / paint ----------
const SAVE_KEY='neon_highway_v032j_garageA';
const COLOR_OPTIONS=[
  {name:'Graphite', hex:0x49515d, price:0},
  {name:'Midnight Blue', hex:0x25476a, price:900},
  {name:'Crimson', hex:0x8c394a, price:1100},
  {name:'Pearl White', hex:0xcfd4dc, price:1400},
  {name:'Black', hex:0x23272d, price:1600}
];
const defaultSave={
  credits:5000,
  bestKm:0,
  totalCredits:0,
  color:0,
  ownedColors:[0]
};
let saveData=JSON.parse(JSON.stringify(defaultSave));
try{
  const raw=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
  Object.assign(saveData, raw||{});
}catch(e){}
if(!Array.isArray(saveData.ownedColors) || !saveData.ownedColors.length) saveData.ownedColors=[0];

function persistSave(){
  localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
}

// ---------- materials ----------
const matRoad = new THREE.MeshStandardMaterial({color:0x353943,roughness:.48,metalness:.25});
const matBarrier = new THREE.MeshStandardMaterial({color:0x8b929c,roughness:.6,metalness:.15});
const matDark = new THREE.MeshStandardMaterial({color:0x0d111a,roughness:.8});
const matGlass = new THREE.MeshStandardMaterial({color:0x07121d,roughness:.16,metalness:.35});
const matCar = new THREE.MeshStandardMaterial({color:0x353a43,roughness:.24,metalness:.72});
const matTire = new THREE.MeshStandardMaterial({color:0x08090c,roughness:.8});
const matWheel = new THREE.MeshStandardMaterial({color:0x555e6a,roughness:.4,metalness:.8});
const matRed = new THREE.MeshBasicMaterial({color:0xff284f});
const matWhite = new THREE.MeshBasicMaterial({color:0xeaf6ff});
const matCyan = new THREE.MeshBasicMaterial({color:0x40ddff});
const matPink = new THREE.MeshBasicMaterial({color:0xff3fae});

// ---------- road ----------
const road = new THREE.Mesh(new THREE.BoxGeometry(24,.14,700),matRoad);
road.position.set(0,-.1,-280);
world.add(road);

for(const side of [-1,1]){
  const wall = new THREE.Mesh(new THREE.BoxGeometry(.45,1.3,700),matBarrier);
  wall.position.set(side*12.05,.55,-280);
  world.add(wall);
}

// lane markings as repeated small meshes
const laneMarks = [];
for(const x of [-4,0,4]){
  for(let z=18; z>-640; z-=12){
    const m = new THREE.Mesh(new THREE.BoxGeometry(.12,.025,5.5),new THREE.MeshBasicMaterial({color:0xdfe6f2}));
    m.position.set(x,.01,z);
    world.add(m); laneMarks.push(m);
  }
}

// side glow rails
for(const side of [-1,1]){
  for(let z=20;z>-650;z-=22){
    const g = new THREE.Mesh(new THREE.BoxGeometry(.18,.14,7), side<0?matPink:matCyan);
    g.position.set(side*11.75,.3,z);
    world.add(g);
  }
}

// ---------- moving city / roadside ----------
const scenery = new THREE.Group();
world.add(scenery);
const rand = mulberry32(1337);
const sceneryItems=[];

function addBuilding(side, z, seedIndex){
  const bw = 7+rand()*11, bd=7+rand()*11, bh=13+rand()*46;
  // Keep every real building safely outside the road/barrier.
  // Road edge is x=±12; minimum inner facade edge is now about ±13.3.
  const dist = 13.3 + bw/2 + rand()*16;
  const geom = new THREE.BoxGeometry(bw,bh,bd);
  const col = new THREE.Color().setHSL(.61+rand()*.13,.2,.16+rand()*.09);
  const mat = new THREE.MeshStandardMaterial({color:col,roughness:.84,metalness:.04});
  const b = new THREE.Mesh(geom,mat);
  b.position.set(side*dist,bh/2-0.1,z);
  scenery.add(b);

  // Simple emissive-looking facade strips.
  const strips=[];
  const count=2+Math.floor(rand()*4);
  for(let s=0;s<count;s++){
    const wm = rand()>.5?matCyan:matPink;
    const win = new THREE.Mesh(new THREE.PlaneGeometry(Math.min(3.2,bw*.5),.55),wm);
    win.position.set(side*(dist - side*bw/2 - side*.02), 2.5+s*(bh/(count+1)), z + (rand()-.5)*bd*.35);
    win.rotation.y = side>0 ? -Math.PI/2 : Math.PI/2;
    scenery.add(win); strips.push(win);
  }
  sceneryItems.push({root:b, children:strips, side, span:650});
}

for(let side of [-1,1]){
  for(let i=0;i<72;i++){
    addBuilding(side, -12 - i*8.7 - rand()*2.2, i);
  }
}

// ART PASS 5: far filler skyline.
// This does NOT replace or cover the beautiful Tokyo photo background.
// It only closes the biggest moving holes between the near buildings.
for(let side of [-1,1]){
  for(let i=0;i<30;i++){
    const z = -28 - i*21.5;
    const h = 22 + rand()*38;
    const w = 10 + rand()*12;
    const d = 10 + rand()*13;
    const col = new THREE.Color().setHSL(.62 + rand()*.08, .24, .12 + rand()*.07);
    const m = new THREE.MeshStandardMaterial({color:col,roughness:.91,metalness:.02});
    const tower = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
    tower.position.set(side*(33 + rand()*13), h/2-.1, z);
    scenery.add(tower);
    sceneryItems.push({root:tower, children:[], side, span:650});
  }
}
// overhead sign gantries
const gantries=[];
for(let z=-90; z>-660; z-=145){
  const gg=new THREE.Group();
  const postMat = new THREE.MeshStandardMaterial({color:0x5d6a7b,roughness:.55,metalness:.55});
  const cross = new THREE.Mesh(new THREE.BoxGeometry(23,.35,.35),postMat);
  cross.position.set(0,8,0); gg.add(cross);
  for(const side of [-1,1]){
    const p = new THREE.Mesh(new THREE.BoxGeometry(.35,8,.35),postMat);
    p.position.set(side*10.8,4,0); gg.add(p);
  }
  for(const x of [-6,0,6]){
    const sign = new THREE.Mesh(new THREE.BoxGeometry(5.2,2.5,.18),new THREE.MeshStandardMaterial({color:0x0e625f,roughness:.42}));
    sign.position.set(x,6.6,.2); gg.add(sign);
    const bar = new THREE.Mesh(new THREE.BoxGeometry(3.4,.14,.02),matWhite);
    bar.position.set(x,6.7,.31); gg.add(bar);
  }
  gg.position.z=z;
  world.add(gg); gantries.push(gg);
}
// Street lamps: more light and stronger forward motion cue.
const streetLights=[];
for(let side of [-1,1]){
  for(let z=-25;z>-680;z-=32){
    const g=new THREE.Group();
    const pole=new THREE.Mesh(new THREE.BoxGeometry(.16,6,.16),new THREE.MeshStandardMaterial({color:0x505965,roughness:.55,metalness:.5}));
    pole.position.y=3; g.add(pole);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(1.5,.12,.12),new THREE.MeshStandardMaterial({color:0x505965,roughness:.55,metalness:.5}));
    arm.position.set(-side*.66,5.85,0); g.add(arm);
    const lamp=new THREE.Mesh(new THREE.BoxGeometry(.65,.12,.28),new THREE.MeshBasicMaterial({color:0xffd994}));
    lamp.position.set(-side*1.35,5.78,0); g.add(lamp);
    g.position.set(side*11.2,0,z);
    world.add(g); streetLights.push(g);
  }
}


// ---------- car builder ----------
// V0.32C: visual-only car upgrade. Driving physics stays unchanged.
function makeSectionMesh(sections, material){
  const verts=[];
  for(const s of sections){
    verts.push(
      -s.w, s.y0, s.z,   s.w, s.y0, s.z,
      -s.w, s.y1, s.z,   s.w, s.y1, s.z
    );
  }
  const idx=[];
  for(let i=0;i<sections.length-1;i++){
    const a=i*4,b=(i+1)*4;
    // bottom
    idx.push(a,b,b+1, a,b+1,a+1);
    // left side
    idx.push(a,a+2,b+2, a,b+2,b);
    // right side
    idx.push(a+1,b+1,b+3, a+1,b+3,a+3);
    // top
    idx.push(a+2,a+3,b+3, a+2,b+3,b+2);
  }
  // caps
  idx.push(0,1,3, 0,3,2);
  const n=(sections.length-1)*4;
  idx.push(n,n+2,n+3, n,n+3,n+1);

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g,material);
}

function makeCar(color=0x343a45,scale=1){
  const g=new THREE.Group();

  const bodyMat=new THREE.MeshPhysicalMaterial({
    color,
    roughness:.24,
    metalness:.66,
    clearcoat:.42,
    clearcoatRoughness:.22
  });
  const trimMat=new THREE.MeshStandardMaterial({color:0x0b0e13,roughness:.55,metalness:.30});
  const glassMat=new THREE.MeshPhysicalMaterial({
    color:0x07111c,
    roughness:.08,
    metalness:.18,
    transparent:true,
    opacity:.94
  });
  const tireMat=new THREE.MeshStandardMaterial({color:0x050608,roughness:.88});
  const rimMat=new THREE.MeshStandardMaterial({color:0xaeb6c0,roughness:.28,metalness:.88});
  const brakeMat=new THREE.MeshBasicMaterial({color:0xff3153});
  const brakeInner=new THREE.MeshBasicMaterial({color:0xff9aae});
  const plateMat=new THREE.MeshBasicMaterial({color:0xe7edf4});
  const interiorMat=new THREE.MeshStandardMaterial({color:0x10141b,roughness:.76,metalness:.06});

  // Main body shell.
  const lower=makeSectionMesh([
    {z:-2.56,w:.96,y0:.30,y1:.77},
    {z:-2.06,w:1.19,y0:.30,y1:.90},
    {z:-1.20,w:1.28,y0:.30,y1:.95},
    {z: 1.70,w:1.29,y0:.30,y1:.94},
    {z: 2.24,w:1.22,y0:.30,y1:.84},
    {z: 2.56,w:1.04,y0:.30,y1:.72}
  ],bodyMat);
  g.add(lower);

  // Close the underside and central body volume.
  const floorPan=new THREE.Mesh(new THREE.BoxGeometry(2.05,.08,4.62),trimMat);
  floorPan.position.set(0,.33,0.03);
  g.add(floorPan);

  const cabinFill=new THREE.Mesh(new THREE.BoxGeometry(1.48,.54,2.48),interiorMat);
  cabinFill.position.set(0,1.17,-.04);
  g.add(cabinFill);

  const firewall=new THREE.Mesh(new THREE.BoxGeometry(1.48,.56,.10),interiorMat);
  firewall.position.set(0,1.12,-1.16);
  g.add(firewall);

  const rearBulkhead=new THREE.Mesh(new THREE.BoxGeometry(1.42,.52,.10),interiorMat);
  rearBulkhead.position.set(0,1.10,1.08);
  g.add(rearBulkhead);

  for(const x of [-1.05,1.05]){

// Dedicated 3D bonnet for hood-camera mode.
// This is world-space geometry with real lighting, not a screen overlay.
// The cabin/glass are not rendered in hood view, so they cannot block the screen.
function makeHoodViewModel(){
  const mat=new THREE.MeshPhysicalMaterial({
    color:0x303640,
    roughness:.24,
    metalness:.66,
    clearcoat:.42,
    clearcoatRoughness:.20,
    side:THREE.DoubleSide
  });

  // 3 rows x 3 columns give the bonnet a shallow center ridge.
  const verts=[
    -.92,.91,-1.02,   0,.97,-1.02,   .92,.91,-1.02,
    -1.00,.84,-1.72,   0,.91,-1.72,  1.00,.84,-1.72,
    -.82,.73,-2.50,    0,.79,-2.50,   .82,.73,-2.50
  ];
  const idx=[
    0,3,4, 0,4,1,
    1,4,5, 1,5,2,
    3,6,7, 3,7,4,
    4,7,8, 4,8,5
  ];
  const geom=new THREE.BufferGeometry();
  geom.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  geom.setIndex(idx);
  geom.computeVertexNormals();

  const group=new THREE.Group();
  const hood=new THREE.Mesh(geom,mat);
  group.add(hood);

  // Two subtle pressed creases make it read as a bonnet rather than a flat polygon.
  for(const x of [-.48,.48]){
    const crease=new THREE.Mesh(
      new THREE.BoxGeometry(.022,.016,1.20),
      new THREE.MeshBasicMaterial({color:0x65707e,transparent:true,opacity:.34})
    );
    crease.position.set(x,.925,-1.62);
    crease.rotation.x=-.12;
    group.add(crease);
  }

  group.userData.paintMats=[mat];
  group.visible=false;
  return group;
}

function makeGarageLabel(text, fg='#dff6ff', bg='#10293a'){
  const c=document.createElement('canvas');
  c.width=512; c.height=128;
  const x=c.getContext('2d');
  x.fillStyle=bg; x.fillRect(0,0,c.width,c.height);
  x.strokeStyle='#59dfff'; x.lineWidth=6; x.strokeRect(8,8,c.width-16,c.height-16);
  x.fillStyle=fg;
  x.font='bold 56px monospace';
  x.textAlign='center';
  x.textBaseline='middle';
  x.fillText(text, c.width/2, c.height/2);
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  const mat=new THREE.MeshBasicMaterial({map:tex, transparent:false});
  return new THREE.Mesh(new THREE.PlaneGeometry(6.8,1.7), mat);
}

function setPaintOnGroup(group, hex){
  const mats=group?.userData?.paintMats || [];
  for(const mat of mats){
    mat.color.setHex(hex);
  }
}

function applySelectedColor(index){
  saveData.color=index;
  const hex=COLOR_OPTIONS[index].hex;
  setPaintOnGroup(player, hex);
  setPaintOnGroup(garageCar, hex);
  setPaintOnGroup(hoodViewModel, hex);
  persistSave();
  updateGarageHud();
  renderGaragePanel();
}

function buyOrSelectColor(index){
  const opt=COLOR_OPTIONS[index];
  if(!saveData.ownedColors.includes(index)){
    if(saveData.credits < opt.price) return;
    saveData.credits -= opt.price;
    saveData.ownedColors.push(index);
  }
  applySelectedColor(index);
}

function updateGarageHud(){
  const c=document.getElementById('creditsVal');
  const b=document.getElementById('bestRunVal');
  if(c) c.textContent=Math.floor(saveData.credits).toLocaleString('de-DE')+' CR';
  if(b) b.textContent=(saveData.bestKm||0).toFixed(1)+' km';
}

  const title=document.getElementById('garagePanelTitle');
  if(!garagePanelMode){
    return;
  }
  title.textContent=garagePanelMode.toUpperCase();

  if(garagePanelMode==='stats'){
    body.innerHTML=`
      <div class="garageCard">
        <div class="garageStat"><span>BEST RUN</span><strong>${(saveData.bestKm||0).toFixed(1)} km</strong></div>
        <div class="garageStat"><span>TOTAL CREDITS</span><strong>${Math.floor(saveData.totalCredits||0).toLocaleString('de-DE')} CR</strong></div>

        <div class="ttl">INFO</div>
        <div style="color:#adc0dd;line-height:1.45;font-size:13px">
          Das ist jetzt bewusst die erste saubere Garage-Version:
          derselbe Wagen wie im Highway, Start aus der Garage, Savegame
          und vorerst nur Lackfarben-Tuning.
        </div>
      </div>

    return;
  }

  const swatches=COLOR_OPTIONS.map((o,i)=>{

// traffic
const traffic = [];
const laneX=[-6,-2,2,6];

// V0.32H traffic rule:
// - first 2–3 seconds are readable
// - after that there is steady action
// - when the open route changes lane, BOTH old and new lanes stay open
//   for one traffic pocket, so the player is never asked to teleport sideways.
function addTrafficCar(lane,z,speedKmh){
  const c=makeCar(new THREE.Color().setHSL(Math.random(),.27,.38).getHex(),.92);
  c.position.set(laneX[lane],0,z);
  c.userData.lane=lane;
  c.userData.desiredSpeed=speedKmh;
  c.userData.speed=speedKmh;
  c.userData.near=false;
  c.userData.wallNudge=false;
  world.add(c);
  traffic.push(c);
  return c;
}

function placeTrafficInitial(){
  for(const t of traffic) world.remove(t);
  traffic.length=0;

  // Read-in: visible traffic ahead, but no instant wall.
  addTrafficCar(1,-50,88);
  addTrafficCar(3,-63,92);
  addTrafficCar(0,-76,86);

  // Curated corridor path. Density stays almost identical on every retry.
  // A repeated open lane may have 3 NPCs; a lane-change transition gets only
  // 2 NPCs so both the OLD and NEW route stay open.
  const openPath=[2,2,1,1,0,0,1,2,2,3,3,2,1,1];
  let z=-91;
  let prevOpen=openPath[0];

  for(let band=0;band<openPath.length;band++){
    const open=openPath[band];
    const changing=(band>0 && open!==prevOpen);

    let occupied;
    if(changing){
      // Guaranteed transition window: old lane + new lane are both free.
      occupied=[0,1,2,3].filter(l=>l!==open && l!==prevOpen);
    }else{
      // Steady section: leave one route open.
      occupied=[0,1,2,3].filter(l=>l!==open);

      // Every other steady pocket uses only 2 cars, avoiding constant walls.
      if(band%2===1){
        occupied.splice((band*3)%occupied.length,1);
      }
    }

    const pocketSpeed=88 + ((band%5)-2)*2; // narrow 84–92 km/h range
    occupied.forEach((lane,i)=>{
      // Small longitudinal stagger: visually organic, never a flat row.
      const stagger=(i-(occupied.length-1)/2)*3.6;
      addTrafficCar(lane,z+stagger,pocketSpeed);
    });

    prevOpen=open;
    z-=20 + (band%3)*2; // stable 20/22/24 m rhythm
  }
}

// For cars that recycle later in a long run, keep density stable without
// rebuilding horizontal walls.
let recycleLaneCursor=0;
function chooseRecycleLane(z,ignore=null){
  const order=[2,0,3,1,2,3,0,1];
  for(let tries=0;tries<order.length;tries++){
    const lane=order[(recycleLaneCursor+tries)%order.length];

    const sameLaneClose=traffic.some(t=>
      t!==ignore &&
      t.userData.lane===lane &&
      Math.abs(t.position.z-z)<18
    );
    if(sameLaneClose) continue;

    // Never create four lanes occupied within one tight longitudinal slice.
    const nearby=traffic.filter(t=>t!==ignore && Math.abs(t.position.z-z)<6.5);
    const occupied=new Set(nearby.map(t=>t.userData.lane));
    if(occupied.size>=3 && !occupied.has(lane)) continue;

    recycleLaneCursor=(recycleLaneCursor+tries+1)%order.length;
    return lane;
  }

  recycleLaneCursor=(recycleLaneCursor+1)%order.length;
  return order[recycleLaneCursor];
}

function preventTrafficWall(){
  // This is now only an emergency guard.
  // We no longer use the old "rocket one NPC forward" logic that created
  // alternating traffic walls and huge empty sections.
  for(let center=-55;center>-210;center-=10){
    const group=traffic.filter(t=>t.position.z<center+5.5 && t.position.z>center-5.5);
    const lanes=new Set(group.map(t=>t.userData.lane));

    if(lanes.size===4){
      const nearestLane=laneX
        .map((x,i)=>({i,d:Math.abs(x-player.position.x)}))
        .sort((a,b)=>a.d-b.d)[0].i;

      const chosen=group.find(t=>t.userData.lane===nearestLane) || group[0];

      // Open a real longitudinal gap while still far away.
      // One-time 12 m correction is more reliable than accelerating a car
      // that may not move away quickly enough before the player arrives.
      if(!chosen.userData.wallNudge){
        chosen.position.z-=12;
        chosen.userData.wallNudge=true;
      }
    }
  }

  for(const c of traffic){
    if(c.position.z<-105) c.userData.wallNudge=false;
  }
}

// ---------- game ----------
const input={left:false,right:false,boost:false};
addEventListener('keydown',e=>{
  if(gameMode!=='drive') return;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') input.left=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') input.right=true;
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){ input.boost=true; e.preventDefault(); }
  
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') input.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') input.right=false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') input.boost=false;
});
addEventListener('message',e=>{
  const d=e.data||{};
  if(d.channel!=='neon-input')return;
  if(d.type==='focus'){try{window.focus()}catch(err){};return;}
  const down=d.type==='down',k=d.key||'';
  if(k==='ArrowLeft'||k==='a'||k==='A') input.left=down;
  if(k==='ArrowRight'||k==='d'||k==='D') input.right=down;
  if(k==='ArrowUp'||k==='w'||k==='W') input.boost=down;
});


function bindTouch(id,key){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();input[key]=true};
  const off=e=>{e.preventDefault();input[key]=false};
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off); el.addEventListener('pointerleave',off);
}
bindTouch('touchLeft','left'); bindTouch('touchRight','right');
const gasBtn=document.getElementById('gasBtn');
for(const ev of ['pointerdown']) gasBtn.addEventListener(ev,e=>{e.preventDefault();input.boost=true});
for(const ev of ['pointerup','pointercancel','pointerleave']) gasBtn.addEventListener(ev,e=>{e.preventDefault();input.boost=false});

renderer.domElement.addEventListener('pointerdown',e=>{
  if(gameMode!=='garage') return;
  garageDrag=true;
  garageDragLastX=e.clientX;
});
addEventListener('pointerup',()=> garageDrag=false);
addEventListener('pointercancel',()=> garageDrag=false);
addEventListener('pointermove',e=>{
  if(!garageDrag || gameMode!=='garage') return;
  const dx=e.clientX-garageDragLastX;
  garageDragLastX=e.clientX;
  garageYawTarget += dx*.014;
});

  parent.postMessage({channel:'neon-audio',type:'highway',speed:0,boost:0,running:false},'*');

updateEngineAudio(dt);

// Hood view is a screen-space overlay.
// This guarantees that the hood is clearly visible and does not change steering physics.
const hoodScreen=document.getElementById('hoodScreen');

function setCameraMode(mode){
  cameraMode=mode;

  // Old 2D overlay stays permanently disabled.
  hoodScreen.style.display='none';

  // Chase = normal full car. Hood = only the dedicated real 3D bonnet.
  player.visible=(mode!=='hood');
  hoodViewModel.visible=(mode==='hood');

  camera.near=.08;
  camera.updateProjectionMatrix();

  const span=document.querySelector('#cameraBtn span');
  if(span) span.textContent=mode==='hood'?'HOOD':'CHASE';
}

document.getElementById('cameraBtn').addEventListener('click',()=>{
  if(gameMode!=='drive') return;
  setCameraMode(cameraMode==='chase'?'hood':'chase');
});

document.getElementById('startBtn').onclick=()=>startDrive();

function resetTrafficCar(c){
  const farthest=Math.min(-155,...traffic.filter(t=>t!==c).map(t=>t.position.z));

  // Fixed-ish spacing prevents both giant empty sections and sudden walls.
  let z=farthest-(14+Math.random()*4);
  const lane=chooseRecycleLane(z,c);

  c.position.z=z;
  c.position.x=laneX[lane];
  c.userData.lane=lane;

  // Narrow NPC speed range keeps traffic pockets from exploding apart
  // or compressing into a wall after a few seconds.
  const s=86+Math.random()*8;
  c.userData.desiredSpeed=s;
  c.userData.speed=s;
  c.userData.near=false;
  c.userData.wallNudge=false;
}






// ---- SOUND TODO: intentionally disabled until final polish ----
function initEngineAudio(){}
function updateEngineAudio(dt){}
function update(dt){
  if(!running) return;
  elapsed += dt;
  cruiseSpeed = Math.min(255, 125 + elapsed*1.55);

  // Traffic-Racer-like throttle: normal automatic cruise, hold GAS for a temporary push.
  const boostTarget = input.boost ? 1 : 0;
  boostAmount += (boostTarget-boostAmount)*Math.min(1,dt*(input.boost?4.8:3.4));
  speed = cruiseSpeed + boostAmount*72;
  if(!window.__neonAudAt || performance.now()-window.__neonAudAt>90){
    window.__neonAudAt=performance.now();
    parent.postMessage({channel:'neon-audio',type:'highway',speed,boost:boostAmount,running:true},'*');
  }

  // Visually move a few metres forward under throttle, then smoothly return.
  const targetPlayerZ = 3.5 - boostAmount*2.15;
  player.position.z += (targetPlayerZ-player.position.z)*Math.min(1,dt*4.8);

  distance += speed*dt/3600;
  score += dt*(15 + speed*.16)*combo;

  const steer=(input.right?1:0)-(input.left?1:0);
  steerVel += steer*7.2*dt;
  steerVel *= Math.pow(.035,dt);
  steerVel = THREE.MathUtils.clamp(steerVel,-2.5,2.5);
  player.position.x += steerVel*dt*4.0;
  // Hard road-edge lock: road edge ≈ ±8 and player half-width ≈ 1.10.
  // Keeping the player CENTER within ±6.9 means the whole car stays on the four-lane roadway.
  // This removes the permanent safe shoulder at the extreme left/right.
  player.position.x = THREE.MathUtils.clamp(player.position.x,-6.9,6.9);
  player.rotation.z = -steerVel*.045;
  player.rotation.y = -steerVel*.025;

  // camera only — driving formulas above remain exactly unchanged.
  if(cameraMode==='chase'){
    const desiredX = player.position.x*.12;
    camera.position.x += (desiredX-camera.position.x)*Math.min(1,dt*3.2);
    camera.position.y += (4.45-camera.position.y)*Math.min(1,dt*4);
    camera.position.z += ((11.2 + boostAmount*.55)-camera.position.z)*Math.min(1,dt*4);
    const targetFov = 58 + boostAmount*4.5;
    camera.fov += (targetFov-camera.fov)*Math.min(1,dt*4);
    camera.updateProjectionMatrix();
    camera.lookAt(camera.position.x*.18,1.0,-24);
  }else{
    // Hood camera: sits higher and farther back than V0.32G.
    // Only the bonnet mesh is visible, so no transparent windscreen/cabin can
    // rise into the middle of the picture.
    hoodViewModel.position.copy(player.position);
    hoodViewModel.rotation.copy(player.rotation);

    const hoodX=player.position.x;
    const hoodY=1.50;
    const hoodZ=player.position.z-.42;

    camera.position.x += (hoodX-camera.position.x)*Math.min(1,dt*16);
    camera.position.y += (hoodY-camera.position.y)*Math.min(1,dt*16);
    camera.position.z += (hoodZ-camera.position.z)*Math.min(1,dt*16);

    const targetFov=65 + boostAmount*4.5;
    camera.fov += (targetFov-camera.fov)*Math.min(1,dt*9);
    camera.updateProjectionMatrix();
    camera.lookAt(player.position.x,.82,-31);
  }

  // Traffic AI: every NPC follows the car ahead in its lane.
  // Faster cars brake instead of clipping through slower traffic.
  const playerMS = speed/3.6;

  for(let lane=0; lane<laneX.length; lane++){
    const laneCars = traffic
      .filter(c=>c.userData.lane===lane)
      .sort((a,b)=>a.position.z-b.position.z); // most forward (more negative) first

    for(let i=0;i<laneCars.length;i++){
      const c=laneCars[i];
      const ahead = i>0 ? laneCars[i-1] : null;
      let target = c.userData.desiredSpeed;

      if(ahead){
        const gap = c.position.z - ahead.position.z;
        const safeGap = 16 + c.userData.speed*.09;

        if(gap < safeGap){
          // Match the vehicle ahead with extra braking if very close.
          const pressure = THREE.MathUtils.clamp((safeGap-gap)/safeGap,0,1);
          target = Math.min(target, ahead.userData.speed - pressure*28);
        }
      }

      target = Math.max(35,target);
      const accelRate = target < c.userData.speed ? 3.6 : 1.25;
      c.userData.speed += (target-c.userData.speed)*Math.min(1,dt*accelRate);
    }
  }

  preventTrafficWall();

  for(const c of traffic){
    const rel = playerMS - c.userData.speed/3.6;
    c.position.z += rel*dt;

    if(c.position.z > -0.2 && !c.userData.near){
      const dx=Math.abs(c.position.x-player.position.x);
      const contactX=(player.userData.hitHalfX||1.10)+(c.userData.hitHalfX||1.00);
      if(dx < contactX + .95 && dx > contactX + .08){
        combo=Math.min(8,combo+1);
        score += 250*combo;
        c.userData.near=true;
      }
    }

    if(c.position.z > 20) resetTrafficCar(c);

    const dxHit=Math.abs(c.position.x-player.position.x);
    const dzHit=Math.abs(c.position.z-player.position.z);
    const hitX=(player.userData.hitHalfX||1.10)+(c.userData.hitHalfX||1.00);
    const hitZ=(player.userData.hitHalfZ||2.20)+(c.userData.hitHalfZ||2.00);

    if(dzHit<hitZ && dxHit<hitX){
      running=false;
      const earned=Math.max(20, Math.floor(distance*65 + score*.006));
      saveData.credits += earned;
      saveData.totalCredits += earned;
      saveData.bestKm = Math.max(saveData.bestKm||0, distance);
      persistSave();
      updateGarageHud();
      showCrashOverlay(earned);
      break;
    }
  }

  // fake lane motion / roadside impression
  for(const m of laneMarks){
    m.position.z += playerMS*dt;
    if(m.position.z>25) m.position.z-=660;
  }

  // Move the whole roadside world toward the car, then recycle it.
  // This fixes the old "static/swaying city" feeling.
  for(const it of sceneryItems){
    it.root.position.z += playerMS*dt;
    for(const ch of it.children) ch.position.z += playerMS*dt;
    if(it.root.position.z>35){
      const shift=it.span;
      it.root.position.z-=shift;
      for(const ch of it.children) ch.position.z-=shift;
    }
  }
  for(const g of gantries){
    g.position.z += playerMS*dt;
    if(g.position.z>30) g.position.z-=580;
  }
  for(const l of streetLights){
    l.position.z += playerMS*dt;
    if(l.position.z>30) l.position.z-=680;
  }

  document.getElementById('speedVal').textContent=Math.round(speed);
  document.getElementById('distVal').textContent=distance.toFixed(1)+' km';
  document.getElementById('scoreVal').textContent=Math.floor(score).toLocaleString('de-DE');
  document.getElementById('nearVal').textContent='x'+combo;
  document.getElementById('boostVal').textContent='BOOST '+Math.round(boostAmount*100)+'%';
}

camera.position.set(0,4.45,11.2);
camera.lookAt(0,1,-24);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(.033,clock.getDelta());

  if(gameMode==='garage'){
    garageCar.rotation.y += (garageYawTarget-garageCar.rotation.y)*Math.min(1, dt*8.5);
    camera.position.x += (-8.8-camera.position.x)*Math.min(1,dt*4.0);
    camera.position.y += (3.55-camera.position.y)*Math.min(1,dt*4.0);
    camera.position.z += (11.4-camera.position.z)*Math.min(1,dt*4.0);
    camera.lookAt(-1.7,1.0,0.9);
  }else{
    update(dt);
  }

  renderer.render(scene,camera);
}
// Connected-mode bridge. Register only now, after saveData/player/hoodViewModel/startDrive exist.
addEventListener('message',event=>{
  if(event.source!==parent || event.data?.channel!=='neon-garage' || event.data.type!=='start') return;
  const incoming=event.data.save||{};
  for(const key of ['credits','bestKm','totalCredits']){
    if(Number.isFinite(incoming[key])) saveData[key]=Math.max(0,incoming[key]);
  }
  const colors={graphite:0x596171,black:0x161b25,blue:0x1c69ff,red:0xef2a2a,white:0xdfe5ed};
  const hex=colors[event.data.appearance?.color]??colors.graphite;
  for(const group of [player,hoodViewModel]){
    const mats=group?.userData?.paintMats||[];
    for(const material of mats) material.color.setHex(hex);
  }
  startDrive();
});

gameMode='drive';
running=false;
world.visible=true;
garageWorld.visible=false;
document.getElementById('garageUI').style.display='none';
document.getElementById('hud').style.display='block';
resetRunState();
// Parent keeps the requested start pending and resends it when this arrives.
parent.postMessage({channel:'neon-highway',type:'ready'},'*');
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
