#boot::before{
  content:"";position:absolute;left:0;right:0;bottom:0;height:18.8%;z-index:1;

#boot::after{content:"";position:absolute;z-index:1;left:0;right:0;bottom:0;height:27%;background:linear-gradient(to bottom,rgba(5,8,17,0),rgba(5,8,17,.82) 42%,rgba(5,8,17,.97) 100%)}
#bootUi{position:relative;z-index:2;width:min(760px,78vw);padding-bottom:5.5vh;text-align:center}
#bootBarFrame{height:25px;position:relative;border:3px solid #42dfff;background:#07111f;box-shadow:0 0 0 3px #152c51,0 0 22px rgba(56,221,255,.38),inset 0 0 14px rgba(0,0,0,.85);clip-path:polygon(2% 0,98% 0,100% 24%,100% 76%,98% 100%,2% 100%,0 76%,0 24%);overflow:hidden}
#bootFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#17cfff,#31f3ff 58%,#91ffff);box-shadow:0 0 14px #23e7ff;transition:width .1s linear}
#bootFill::after{content:"";position:absolute;right:-45px;top:0;width:80px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:bootShine .9s linear infinite}
#bootLabel{margin-top:12px;color:#e5f7ff;font:900 clamp(15px,2vw,25px) ui-monospace,monospace;letter-spacing:4px;text-shadow:0 0 10px #2ecfff,2px 2px 0 #091227}
#bootPct{margin-top:5px;color:#78dcff;font:700 12px ui-monospace,monospace;letter-spacing:2px}
#pressStart{display:none;margin-top:14px;color:#ff7ee3;font:900 clamp(23px,3.7vw,44px) ui-monospace,monospace;letter-spacing:4px;text-shadow:0 0 9px #ff3fd4,0 0 22px rgba(255,63,212,.75),3px 3px 0 #241039;cursor:pointer;animation:pressPulse 1.15s ease-in-out infinite}
#pressSub{display:none;margin-top:4px;color:#d8ecff;font:800 11px ui-monospace,monospace;letter-spacing:3px;animation:pressSubPulse 1.15s ease-in-out infinite}
#boot.ready #bootLabel,#boot.ready #bootPct{display:none}
#boot.ready #pressStart,#boot.ready #pressSub{display:block}
#boot.leaving{opacity:0;pointer-events:none}
@keyframes pressPulse{0%,100%{transform:scale(1);filter:brightness(.9)}50%{transform:scale(1.055);filter:brightness(1.35)}}
@keyframes pressSubPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes bootShine{from{transform:translateX(-80px)}to{transform:translateX(130px)}}
@media(max-width:760px){#bootUi{width:86vw;padding-bottom:6vh}#bootBarFrame{height:20px}}


#storyIntro{position:fixed;inset:0;z-index:9100;display:none;background:linear-gradient(90deg,rgba(4,7,16,.34),rgba(4,7,16,.06) 52%,rgba(4,7,16,.28));opacity:0;transition:opacity .42s ease;overflow:hidden}
#storyIntro.show{display:block;opacity:1}#storyIntro.leaving{opacity:0;pointer-events:none}
#storyChar{position:absolute;left:2.7vw;bottom:13vh;width:min(24vw,315px);aspect-ratio:306/358;border:3px solid #31dfff;background:#07111e;overflow:hidden;box-shadow:0 0 0 3px rgba(18,49,82,.94),0 0 28px rgba(37,222,255,.50),0 20px 55px rgba(0,0,0,.54);clip-path:polygon(7% 0,100% 0,100% 91%,93% 100%,0 100%,0 8%);transform:translateX(-125%) rotate(-1deg);transition:transform .56s cubic-bezier(.18,.78,.20,1.06);animation:storyBob 2.2s ease-in-out infinite}
#storyIntro.show #storyChar{transform:translateX(0) rotate(-1deg)}
#storyPortrait{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .12s ease}
#storyTag{position:absolute;left:5.1vw;bottom:9.3vh;color:#45e5ff;background:#07101d;border:1px solid #2bd9ff;padding:6px 12px;font:900 12px ui-monospace,monospace;letter-spacing:2px;box-shadow:0 0 15px rgba(45,220,255,.24)}
#storyBox{position:absolute;left:min(29vw,380px);right:4vw;bottom:8.2vh;min-height:154px;padding:22px 25px 18px;background:linear-gradient(135deg,rgba(4,12,25,.96),rgba(9,17,36,.93));border:2px solid #31dfff;box-shadow:0 0 0 3px rgba(18,49,82,.80),0 0 31px rgba(40,218,255,.22);clip-path:polygon(2% 0,100% 0,100% 82%,97% 100%,0 100%,0 12%);transform:translateY(35px);opacity:0;transition:transform .48s .12s ease,opacity .4s .12s ease}
#storyIntro.show #storyBox{transform:translateY(0);opacity:1}
#storyName{font:900 13px ui-monospace,monospace;color:#ff6fda;letter-spacing:2.5px;margin-bottom:9px;text-shadow:0 0 9px rgba(255,70,210,.55)}
#storyText{font:800 clamp(15px,1.55vw,21px) ui-monospace,monospace;color:#eef8ff;line-height:1.48;min-height:68px;text-shadow:0 2px 0 #07101d}
#storyControls{display:flex;align-items:center;justify-content:space-between;margin-top:14px;color:#82bad2;font:800 10px ui-monospace,monospace;letter-spacing:1.4px}
#storyNext{color:#6ff4ff;animation:storyNextPulse 1s ease-in-out infinite}
#storySkip{position:absolute;right:4vw;top:4vh;border:1px solid rgba(107,229,255,.55);background:rgba(4,12,24,.72);color:#a9d9e9;padding:8px 12px;font:800 10px ui-monospace,monospace;letter-spacing:1.4px;cursor:pointer}

/*
NEON GARAGE AUDIO V3.1 — REFINED DEEP ENGINE
Based on the V3 sound the user preferred over V4.
Changes:
- less lawnmower-like roughness
- smoother inline-6-ish harmonic blend
- less saw/noise
- highway becomes calmer during long sustained full-throttle/boost
- drag remains more aggressive and tightly RPM-synced
*/
const NEON_GARAGE_MUSIC='https://upload.wikimedia.org/wikipedia/commons/9/9f/Chill_Beat.ogg';

let neonAudioReady=false,neonAudioMode='boot',neonCtx=null,garageMusic=null;
let playerEngine=null,rivalEngine=null,playerShiftUntil=0;
let highwayHold=0,highwayLastAudioTs=performance.now();

function makeDriveCurve(amount=1.85){
  const curve=new Float32Array(2048);
  for(let i=0;i<curve.length;i++){
    const x=i*2/(curve.length-1)-1;
    curve[i]=Math.tanh(x*amount);
  }
  return curve;
}

class NeonEngineVoice{
  constructor(ctx,output,character=0){
    this.ctx=ctx;
    this.character=character;

    this.bus=ctx.createGain();
    this.bus.gain.value=.0001;

    // Warmer low end, gentler top end.
    this.lowShelf=ctx.createBiquadFilter();
    this.lowShelf.type='lowshelf';
    this.lowShelf.frequency.value=145;
    this.lowShelf.gain.value=5.2-character*.6;

    this.bodyFilter=ctx.createBiquadFilter();
    this.bodyFilter.type='lowpass';
    this.bodyFilter.frequency.value=1050;
    this.bodyFilter.Q.value=.58;

    this.drive=ctx.createWaveShaper();
    this.drive.curve=makeDriveCurve(1.75+character*.18);
    this.drive.oversample='4x';

    this.bus.connect(this.drive).connect(this.lowShelf).connect(this.bodyFilter).connect(output);

    // Main low exhaust body.
    this.sub=ctx.createOscillator();
    this.sub.type='triangle';
    this.subGain=ctx.createGain();
    this.subGain.gain.value=.39;
    this.sub.connect(this.subGain).connect(this.bus);

    // Smooth harmonic-rich main engine tone.
    const real=new Float32Array(10);
    const imag=new Float32Array([0,1,.30,.14,.07,.035,.020,.012,.008,.004]);
    this.bankA=ctx.createOscillator();
    this.bankA.setPeriodicWave(ctx.createPeriodicWave(real,imag,{disableNormalization:false}));
    this.bankAGain=ctx.createGain();
    this.bankAGain.gain.value=.30;
    this.bankA.connect(this.bankAGain).connect(this.bus);

    // V3 had a sawtooth here; triangle is much smoother and less "lawnmower".
    this.bankB=ctx.createOscillator();
    this.bankB.type='triangle';
    this.bankBGain=ctx.createGain();
    this.bankBGain.gain.value=.045;
    this.bankB.connect(this.bankBGain).connect(this.bus);

    // Low mechanical pulse.
    this.crank=ctx.createOscillator();
    this.crank.type='sine';
    this.crankGain=ctx.createGain();
    this.crankGain.gain.value=.16;
    this.crank.connect(this.crankGain).connect(this.bus);

    // Very subtle low-mid texture.
    const len=ctx.sampleRate*2;
    const b=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=b.getChannelData(0);
    let lp=0;
    for(let i=0;i<len;i++){
      lp=lp*.94+(Math.random()*2-1)*.06;
      d[i]=lp;
    }
    this.noise=ctx.createBufferSource();
    this.noise.buffer=b;
    this.noise.loop=true;
    this.noiseFilter=ctx.createBiquadFilter();
    this.noiseFilter.type='bandpass';
    this.noiseFilter.frequency.value=280+character*30;
    this.noiseFilter.Q.value=.42;
    this.noiseGain=ctx.createGain();
    this.noiseGain.gain.value=.004;
    this.noise.connect(this.noiseFilter).connect(this.noiseGain).connect(this.bus);

    this.sub.start();
    this.bankA.start();
    this.bankB.start();
    this.crank.start();
    this.noise.start();
  }

  set(rpm,load,gain,fast=false,soft=false){
    const ctx=this.ctx,now=ctx.currentTime;
    rpm=Math.max(850,Math.min(7000,Number(rpm)||900));
    load=Math.max(0,Math.min(1,Number(load)||0));
    gain=Math.max(0,Math.min(.48,Number(gain)||0));

    // Keep the deeper V3 character, but smooth the harmonic relationships.
    const crankHz=rpm/60;
    const exhaustHz=rpm/35.5;
    const mainHz=rpm/28.5;
    const tc=fast?.014:.05;

    this.sub.frequency.setTargetAtTime(exhaustHz,now,tc);
    this.bankA.frequency.setTargetAtTime(mainHz,now,tc);
    this.bankB.frequency.setTargetAtTime(mainHz*.50,now,tc);
    this.bankB.detune.setTargetAtTime(this.character?5:-3,now,.07);
    this.crank.frequency.setTargetAtTime(Math.max(22,crankHz*.48),now,tc);

    // Highway soft mode deliberately rolls off the tiring upper range.
    const cutoff = soft
      ? Math.min(1180,610+rpm*.075+load*120)
      : Math.min(1580,690+rpm*.105+load*190);
    this.bodyFilter.frequency.setTargetAtTime(cutoff,now,.08);

    this.noiseFilter.frequency.setTargetAtTime(245+rpm*.042,now,.10);

    this.subGain.gain.setTargetAtTime(.35+load*.10,now,.07);
    this.bankAGain.gain.setTargetAtTime(.25+load*.09,now,.07);
    this.bankBGain.gain.setTargetAtTime(soft?.025:(.035+load*.018),now,.07);
    this.noiseGain.gain.setTargetAtTime(soft?.0025:(.003+load*.005),now,.10);

    this.bus.gain.setTargetAtTime(Math.max(.0001,gain),now,fast?.015:.065);
  }

  silence(){
    this.set(900,0,0,true,true);
  }
}

function neonShiftThump(){
  if(!neonCtx)return;
  const now=neonCtx.currentTime;
  const o=neonCtx.createOscillator();
  const g=neonCtx.createGain();
  const lp=neonCtx.createBiquadFilter();

  o.type='triangle';
  o.frequency.setValueAtTime(82,now);
  o.frequency.exponentialRampToValueAtTime(46,now+.12);

  lp.type='lowpass';
  lp.frequency.value=210;

  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(.070,now+.008);
  g.gain.exponentialRampToValueAtTime(.0001,now+.14);

  o.connect(lp).connect(g).connect(neonCtx.destination);
  o.start(now);
  o.stop(now+.15);
}

function unlockNeonAudio(){
  if(neonAudioReady)return;
  neonAudioReady=true;

  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC){
    neonCtx=new AC();

    const master=neonCtx.createGain();
    master.gain.value=.72;

    const low=neonCtx.createBiquadFilter();
    low.type='lowshelf';
    low.frequency.value=130;
    low.gain.value=3.1;

    const comp=neonCtx.createDynamicsCompressor();
    comp.threshold.value=-18;
    comp.knee.value=20;
    comp.ratio.value=3.1;
    comp.attack.value=.006;
    comp.release.value=.17;

    master.connect(low).connect(comp).connect(neonCtx.destination);

    playerEngine=new NeonEngineVoice(neonCtx,master,0);
    rivalEngine=new NeonEngineVoice(neonCtx,master,.55);
    rivalEngine.silence();
  }

  garageMusic=new Audio(NEON_GARAGE_MUSIC);
  garageMusic.loop=true;
  garageMusic.preload='auto';
  garageMusic.volume=.105;
  garageMusic.play().catch(()=>{});
}

function setNeonAudioMode(mode){
  neonAudioMode=mode;
  highwayHold=0;
  highwayLastAudioTs=performance.now();

  if(garageMusic){
    if(mode==='garage'){
      garageMusic.volume=.105;
      if(garageMusic.paused)garageMusic.play().catch(()=>{});
    }else{
      garageMusic.volume=0;
    }
  }

  if(mode!=='highway'&&mode!=='drag'&&mode!=='drift'){
    playerEngine?.silence();
  }
  if(mode!=='drag'){
    rivalEngine?.silence();
  }
}

function updateNeonGameplayAudio(d){
  if(!neonAudioReady||!neonCtx||!playerEngine)return;

  if(d.type==='shift'){
    playerShiftUntil=performance.now()+125;
    neonShiftThump();
    return;
  }

  if(d.type==='highway'&&neonAudioMode==='highway'){
    if(d.running===false){
      playerEngine.silence();
      highwayHold=0;
      return;
    }

    const now=performance.now();
    const dt=Math.min(.20,Math.max(0,(now-highwayLastAudioTs)/1000));
    highwayLastAudioTs=now;

    const s=Math.max(0,Number(d.speed)||0);
    const boost=Math.max(0,Math.min(1,Number(d.boost)||0));

    // If the player holds high load for several seconds, gradually calm the sound.
    if(boost>.58) highwayHold=Math.min(8,highwayHold+dt);
    else highwayHold=Math.max(0,highwayHold-dt*1.6);

    const settle=Math.max(0,Math.min(1,(highwayHold-3.2)/2.8));

    // Lower, calmer RPM mapping than V3.
    const rpm=Math.min(4550,1180+s*5.3+boost*980-settle*380);
    const load=.26+boost*.64;
    const gain=(.105+Math.min(.040,s/6500)+boost*.055) * (1-settle*.22);

    playerEngine.set(rpm,load,gain,false,true);
    rivalEngine?.silence();
    return;
  }

  if(d.type==='drag'&&neonAudioMode==='drag'){
    const running=d.running!==false;
    if(!running){
      playerEngine.silence();
      rivalEngine?.silence();
      return;
    }

    const visualRpm=Math.max(950,Number(d.rpm)||1100);
    const rs=Math.max(0,Number(d.rivalSpeed)||0);

    // Still tightly synced to the real tachometer, but slightly deeper than V3.
    const soundRpm=950+(visualRpm-950)*.72;
    const shiftCut=performance.now()<playerShiftUntil;

    playerEngine.set(
      soundRpm,
      visualRpm>5000?.90:.60,
      shiftCut?.010:(.120+Math.min(.145,visualRpm/43000)),
      true,
      false
    );

    const thresholds=[0,12,23,34,46,59,73];
    let rg=1;
    for(let i=1;i<thresholds.length;i++)if(rs>=thresholds[i])rg=i+1;
    rg=Math.min(6,rg);

    const low=thresholds[rg-1]||0;
    const high=thresholds[rg]||82;
    const part=Math.max(0,Math.min(1,(rs-low)/Math.max(1,high-low)));
    const rrpm=1650+part*2750;

    rivalEngine.set(rrpm,.62,.043+Math.min(.035,rs/1800),false,false);
    return;
  }

  if(d.type==='drift'&&neonAudioMode==='drift'){
    if(d.running===false){
      playerEngine.silence();
      return;
    }

    const s=Math.max(0,Number(d.speed)||0);
    const rpm=Math.min(4650,1100+s*9.4);
    const load=s>30?.68:.32;

    playerEngine.set(rpm,load,.095+Math.min(.085,s/2300),false,false);
    rivalEngine?.silence();
  }
}

const boot=document.getElementById('boot'),bootFill=document.getElementById('bootFill'),bootPct=document.getElementById('bootPct');
const bootFrames=[garage,highway,drag,drift],bootLoaded=new Set(),bootStarted=performance.now();
let bootValue=0,bootReady=false,bootGone=false;
bootFrames.forEach((frame,i)=>frame.addEventListener('load',()=>bootLoaded.add(i),{once:true}));
function bootTick(){
 if(bootGone)return;
 const age=performance.now()-bootStarted,filePart=bootLoaded.size/bootFrames.length;
 let target=Math.min(92,8+age/34); target=Math.max(target,12+filePart*76);
 if(bootLoaded.size===bootFrames.length&&age>1450)target=100;
 bootValue+=(target-bootValue)*Math.min(1,.08+(target===100?.12:0));
 if(target===100&&bootValue>99.2)bootValue=100;
 bootFill.style.width=bootValue.toFixed(1)+'%'; bootPct.textContent=Math.floor(bootValue)+'%';
 if(bootValue>=100&&!bootReady){bootReady=true;boot.classList.add('ready')}
 if(!bootReady)requestAnimationFrame(bootTick);
}
requestAnimationFrame(bootTick);
function enterGame(e){
 if(!bootReady||bootGone)return;
 if(e&&e.type==='keydown'&&['Shift','Control','Alt','Meta','CapsLock','Tab'].includes(e.key))return;
 unlockNeonAudio();
 setNeonAudioMode('garage');
 bootGone=true;boot.classList.add('leaving');setTimeout(()=>{boot.remove();beginNeonSession();},620);
}
boot.addEventListener('pointerdown',enterGame);addEventListener('keydown',enterGame);

garage.src="garage.html";highway.src="highway.html";
drag.src="drag.html";
drift.src="drift.html";
let save={
  credits:5000,bestKm:0,totalCredits:0,
  owned:{color:['graphite'],wheel:['standard'],ride:['standard'],brake:['standard'],spoiler:['none']},
  appearance:{color:'graphite',wheel:'standard',brakeRed:false,ride:'standard',spoiler:'none'}
};
try{
  const stored=JSON.parse(localStorage.getItem('neon_connected_save')||'{}');
  Object.assign(save,stored||{});
  if(stored?.owned)save.owned=stored.owned;

let pending=null;
function showGarage(){
  setNeonAudioMode('garage');
  highway.style.display='none';drag.style.display='none';drift.style.display='none';garage.style.display='block';
  garage.contentWindow?.postMessage({channel:'neon-highway',type:'save',save},'*');

function showHighway(data){setNeonAudioMode('highway');garage.style.display='none';drag.style.display='none';drift.style.display='none';highway.style.display='block';pending=data;sendHighway();focusHighwayNow();}
function showDrag(data){
  setNeonAudioMode('drag');
  garage.style.display='none';highway.style.display='none';drift.style.display='none';drag.style.display='block';
  pending=data;sendDrag();
}
function showDrift(data){
  setNeonAudioMode('drift');
  for(const k in driftHeldKeys)delete driftHeldKeys[k];
  garage.style.display='none';highway.style.display='none';drag.style.display='none';drift.style.display='block';
  pending=data;sendDrift();focusDriftNow();
}
function sendDrift(){
  if(!drift.contentWindow)return;
  drift.contentWindow.postMessage({channel:'neon-garage',type:'drift-start',save,appearance:pending?.appearance||save.appearance},'*');
}
function sendDrag(){

}

highway.addEventListener('load',sendHighway);

garage.addEventListener('load',()=>garage.contentWindow?.postMessage({channel:'neon-highway',type:'save',save},'*'));
addEventListener('message',event=>{
  const d=event.data||{};
  if(event.origin!==location.origin||![garage.contentWindow,highway.contentWindow,drag.contentWindow,drift.contentWindow].includes(event.source))return;
  if(d.channel==='neon-audio'){updateNeonGameplayAudio(d);return;}
  if(d.channel==='neon-garage'&&d.type==='start'){
    if(d.appearance)save.appearance=d.appearance;
    try{localStorage.setItem('neon_connected_save',JSON.stringify(save))}catch(e){}
    window.queueNeonSync?.(save);
    showHighway(d);
  }
  if(d.channel==='neon-garage'&&d.type==='drag'){
    if(d.appearance)save.appearance=d.appearance;
    try{localStorage.setItem('neon_connected_save',JSON.stringify(save))}catch(e){}
    window.queueNeonSync?.(save);
    showDrag(d);
  }
  if(d.channel==='neon-garage'&&d.type==='drift'){
    if(d.appearance)save.appearance=d.appearance;
    try{localStorage.setItem('neon_connected_save',JSON.stringify(save))}catch(e){}
    window.queueNeonSync?.(save);
    showDrift(d);
  }
  if(d.channel==='neon-garage'&&d.type==='economy'){
    if(d.save){
      if(Number.isFinite(d.save.credits))save.credits=Math.max(0,d.save.credits);
      if(d.save.owned)save.owned=d.save.owned;
      if(d.save.appearance)save.appearance=d.save.appearance;
    }
    try{localStorage.setItem('neon_connected_save',JSON.stringify(save))}catch(e){}
    window.queueNeonSync?.(save);
  }
  if(d.channel==='neon-drag'&&d.type==='ready'&&drag.style.display!=='none')sendDrag();
  if(d.channel==='neon-drag'&&d.type==='garage')showGarage();
  if(d.channel==='neon-drag'&&d.type==='finish'){
    if(Number.isFinite(d.earned))save.credits+=d.earned;
    if(Number.isFinite(d.bestDrag))save.bestDrag=!save.bestDrag?d.bestDrag:Math.min(save.bestDrag,d.bestDrag);
    try{localStorage.setItem('neon_connected_save',JSON.stringify(save))}catch(e){}
    window.queueNeonSync?.(save);
    garage.contentWindow?.postMessage({channel:'neon-highway',type:'save',save},'*');
  }
  if(d.channel==='neon-drift'&&d.type==='ready'&&drift.style.display!=='none')sendDrift();
  if(d.channel==='neon-drift'&&d.type==='garage')showGarage();
  if(d.channel==='neon-drift'&&d.type==='finish'){
    if(Number.isFinite(d.earned))save.credits+=d.earned;
    if(Number.isFinite(d.bestDrift))save.bestDrift=!save.bestDrift?d.bestDrift:Math.max(save.bestDrift,d.bestDrift);
    try{localStorage.setItem('neon_connected_save',JSON.stringify(save))}catch(e){}
    window.queueNeonSync?.(save);
    garage.contentWindow?.postMessage({channel:'neon-highway',type:'save',save},'*');
  }
  if(d.channel==='neon-highway'&&d.type==='ready')sendHighway();
  if(d.channel==='neon-highway'&&d.type==='garage')showGarage();
  if(d.channel==='neon-highway'&&d.type==='save'){
    if(d.save)Object.assign(save,d.save);
    if(Number.isFinite(d.earned))save.credits+=d.earned;
    try{localStorage.setItem('neon_connected_save',JSON.stringify(save))}catch(e){}
    window.queueNeonSync?.(save);
    garage.contentWindow?.postMessage({channel:'neon-highway',type:'save',save},'*');
  }
});
